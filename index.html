<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>famous saying</title>
  </head>
  <body>
    <div class="container">
      <div class="emotions">
        <p>今の気分は？</p>
        <div class="emotion-buttons">
          <button class="emotion-button happy" data-emotion="happy">
            ハッピー
            <i class="fa-solid fa-face-laugh-beam" style="color: #ffd43b"></i>
          </button>
          <button class="emotion-button sad" data-emotion="sad">
            悲しい
            <i class="fa-solid fa-face-sad-tear" style="color: #ffd43b"></i>
          </button>
          <button class="emotion-button lazy" data-emotion="lazy">
            やる気なし
            <i class="fa-solid fa-face-meh" style="color: #ffd43b"></i>
          </button>
          <button class="emotion-button angry" data-emotion="angry">
            怒っている
            <i class="fa-solid fa-face-angry" style="color: #ffd43b"></i>
          </button>
          <button class="emotion-button broken" data-emotion="broken">
            挫けそう
            <i class="fa-solid fa-face-dizzy" style="color: #ffd43b"></i>
          </button>
        </div>
        <div class="quote">
          <p>あなたにぴったりな言葉は・・・</p>
          <div class="quote-display">
            <p class="quote-text"></p>
            <p class="quote-author"></p>
          </div>
          <button class="again-button">もう一度</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/a09f38c296.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
